<!DOCTYPE html>
<html>
    <head>
        <title>Allowance Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="images/WebsiteHeader.jpeg">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600%family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <header class="app-header">
        <img src="images/MainLogo.png" alt="Budgie" class="logo">
        <h1></h1>
        <p class="tagline">Make your allowance last the whole month!</p>
       </header>

        <section id="setup-screen">
            <form id="setup-form">
                <label>Monthly allowance (PKR)</label>
                <input type="number" id="allowance" required>

                <label>Day of month it arrives</label>
                <input type="number" id="payday" min="1" max="31" required>

                <button type="submit">Start Tracking</button>
            </form>
            <button id="demo-btn">Try Demo</button>
        </section>

        <section id="dashboard" class="hidden">
            <div class="hero">
                <p class="hero-label">Money left</p>
                <p class="hero-amount" id="show-left"></p>
                <div class="progress"><div id="progress-fill"></div></div>
                <p class="hero-sub">Spent PKR <span id="show-spent">0</span> of PKR <span id="show-allowance"></span></p>
                <span id="status-pill" class="pill"></span>
                <p id="prediction"></p>
            </div>
            <p>Allowance arrives on day <span id="show-payday"></span></p>
            <h3>Add Expense</h3>
            <form id="expense-form">
                <input type="number" id="exp-amount" min="1" placeholder="Amount" required>
                <select id="exp-category">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Other</option>
                </select>
                <input type="text" id="exp-note" placeholder="Note (Optional)">
                <button type="button" id="mic-btn">Speak</button>
                <p id="voice-status"></p>
                <button type="submit">Add</button>
            </form>
            <h3>Recent Expenses</h3>
            <ul id="expense-list"></ul>
            <button id="reset-btn">Reset</button>
        </section>

        <script src="app.js"></script>
    </body>
</html>
